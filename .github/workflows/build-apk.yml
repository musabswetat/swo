name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. تحميل المشروع
      # ==============================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==============================
      # 2. Java 21
      # ==============================
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'


      # ==============================
      # 3. Node 24
      # ==============================
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'


      # ==============================
      # 4. التحقق من Node
      # ==============================
      - name: Check Node
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version


      # ==============================
      # 5. تثبيت الحزم
      # ==============================
      - name: Install Dependencies
        run: |
          npm install


      # ==============================
      # 6. التأكد من TypeScript
      # ==============================
      - name: Check TypeScript
        run: |
          npx tsc --version


      # ==============================
      # 7. التأكد من Capacitor
      # ==============================
      - name: Check Capacitor
        run: |
          npx cap --version


      # ==============================
      # 8. إنشاء Android
      # ==============================
      - name: Add Android Platform
        run: |
          npx cap add android


      # ==============================
      # 9. إضافة INTERNET
      # ==============================
      - name: Add Internet Permission
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if permission not in text:
              text = text.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )

          p.write_text(text)
          PY


      # ==============================
      # 10. دمج Native yt-dlp Plugin
      # ==============================
      - name: Configure Native yt-dlp Plugin
        run: |
          npm run android:setup


      # ==============================
      # 11. مزامنة Capacitor
      # ==============================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ==============================
      # 12. تنظيف Gradle
      # ==============================
      - name: Clean Android Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon


      # ==============================
      # 13. بناء APK
      # ==============================
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace


      # ==============================
      # 14. رفع APK
      # ==============================
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-Fullscreen-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error