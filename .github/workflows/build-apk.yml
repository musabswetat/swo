name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm install

      - name: Check Capacitor CLI
        run: npx cap --version

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # إضافة أذونات التخزين والوسائط المطلوبة
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' "$MANIFEST"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' "$MANIFEST"

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-Fullscreen-App
          path: android/app/build/outputs/apk/debug/app-debug.apk