<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shorts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000;
      overflow: hidden;
    }

    /* حاوية العرض بملء الشاشة مع التمرير الصارم */
    .shorts-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .shorts-container::-webkit-scrollbar { display: none; }

    .short-card {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* الشريط العلوي */
    .top-bar {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      pointer-events: none;
    }
    .top-bar * { pointer-events: auto; }

    .shorts-logo {
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* تدرج ظلي سفلي لحماية النصوص */
    .overlay-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 240px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      pointer-events: none;
    }

    /* شريط الأزرار التفاعلية الأيمن */
    .action-bar {
      position: absolute;
      right: 12px;
      bottom: calc(65px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .action-btn svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .action-btn span {
      font-size: 11px;
      margin-top: 4px;
    }

    .action-btn.liked svg {
      fill: #ff0000;
    }

    /* بيانات القناة والعنوان */
    .meta-content {
      position: absolute;
      left: 14px;
      right: 80px;
      bottom: calc(65px + env(safe-area-inset-bottom, 0px));
      color: #fff;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .channel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .channel-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #555;
    }

    .channel-name {
      font-size: 13px;
      font-weight: 700;
    }

    .subscribe-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
    }

    .video-title {
      font-size: 13px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* شريط التقدم الدقيق */
    .progress-bar-container {
      position: absolute;
      bottom: calc(52px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.2);
      z-index: 30;
    }

    .progress-bar-fill {
      height: 100%;
      background: #ff0000;
      width: 0%;
    }

    /* شريط التنقل السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(52px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #000;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #aaa;
      font-size: 10px;
      background: none;
      border: none;
    }

    .nav-item.active { color: #fff; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; margin-bottom: 2px; }

    /* النافذة السفلية المنبثقة */
    .modal-sheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: #212121;
      border-radius: 16px 16px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)) 16px;
      z-index: 200;
      transition: bottom 0.3s ease-out;
    }

    .modal-sheet.open { bottom: 0; }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 150;
      display: none;
    }

    .sheet-overlay.active { display: block; }

    .input-box {
      width: 100%;
      background: #121212;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }

    .action-modal-btn {
      width: 100%;
      background: #fff;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .empty-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      color: #777;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="shorts-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff0000"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L22 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73z"/></svg>
      Shorts
    </div>
    <div style="color:#fff; cursor:pointer;" onclick="openModal()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </div>
  </div>

  <div class="shorts-container" id="shortsContainer">
    <div class="empty-placeholder" id="placeholder">
      <p style="font-size: 16px; color: #aaa; margin-bottom: 12px;">لا توجد مقاطع محفوظة حتى الآن</p>
      <p style="font-size: 12px;">اضغط على زر (+) لإضافة رابط يوتيوب وتنزيله في الهاتف</p>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>الرئيسية</button>
    <button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33L18 8.87a3.54 3.54 0 0 0-4.85-1.23L7.7 10.7a3.53 3.53 0 0 0-1.84 3.07c0 1.3.7 2.47 1.84 3.07l5.45-3.07a3.53 3.53 0 0 0 1.84-3.07z"/></svg>Shorts</button>
    <button class="nav-item" onclick="openModal()"><svg style="width:34px;height:34px" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>الاشتراكات</button>
  </div>

  <div class="sheet-overlay" id="overlay" onclick="closeModal()"></div>
  <div class="modal-sheet" id="modalSheet">
    <div style="color:#fff;font-weight:bold;margin-bottom:12px;text-align:center;">تنزيل وحفظ فيديو Shorts في الهاتف</div>
    <input type="text" id="videoUrlInput" class="input-box" placeholder="ضع رابط YouTube Shorts هنا...">
    <button class="action-modal-btn" id="downloadBtn" onclick="handleProcessLink()">تنزيل وحفظ في المجلد</button>
  </div>

  <script>
    const TARGET_FOLDER = 'ShortsVideos';

    // --- 1. إعداد وضع الشاشة الكاملة والصلاحيات ---
    window.addEventListener('DOMContentLoaded', async () => {
      if (window.Capacitor && window.Capacitor.Plugins.StatusBar) {
        const { StatusBar } = window.Capacitor.Plugins;
        try {
          await StatusBar.hide();
          await StatusBar.setOverlaysWebView({ overlay: true });
        } catch (_) {}
      }
      await initStorageAndLoadFiles();
    });

    async function initStorageAndLoadFiles() {
      if (window.Capacitor && window.Capacitor.Plugins.Filesystem) {
        const { Filesystem, Directory } = window.Capacitor.Plugins;
        try {
          await Filesystem.requestPermissions();
          await Filesystem.mkdir({
            path: TARGET_FOLDER,
            directory: Directory.Documents,
            recursive: true
          });
        } catch (_) {}
        await loadLocalShorts();
      }
    }

    // --- 2. محرك استخراج التدفق المباشر عبر الوسيط المفتوح ---
    function extractYouTubeId(url) {
      const match = url.match(/(?:shorts\/|v=|youtu\.be\/|\/v\/|embed\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    async function resolveDirectStream(rawUrl, videoId) {
      // المحاولة الأولى: خوادم Cobalt المتخصصة في دمج الصوت والصورة
      const cobaltInstances = [
        "https://cobaltapi.getnickel.app",
        "https://co.wuk.sh"
      ];

      for (const host of cobaltInstances) {
        try {
          const res = await fetch(host, {
            method: "POST",
            headers: { "Accept": "application/json", "Content-Type": "application/json" },
            body: JSON.stringify({ url: rawUrl, videoQuality: "720" })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.url) {
              return {
                streamUrl: data.url,
                title: "YouTube Short",
                channel: "@ShortsCreator"
              };
            }
          }
        } catch (_) {}
      }

      // المحاولة الثانية: خوادم Invidious لاستخراج تدفق MP4 مباشر ومدمج بالصوت
      const invidiousInstances = [
        "https://inv.tux.pizza",
        "https://invidious.nerdvpn.de",
        "https://invidious.privacydev.net"
      ];

      for (const host of invidiousInstances) {
        try {
          const res = await fetch(`${host}/api/v1/videos/${videoId}`);
          if (res.ok) {
            const data = await res.json();
            if (data.formatStreams && data.formatStreams.length > 0) {
              const stream = data.formatStreams.find(s => s.container === "mp4" || (s.type && s.type.includes("video/mp4"))) || data.formatStreams[0];
              if (stream && stream.url) {
                return {
                  streamUrl: stream.url,
                  title: data.title || "YouTube Short",
                  channel: data.author ? `@${data.author}` : "@Creator"
                };
              }
            }
          }
        } catch (_) {}
      }

      throw new Error("تعذر جلب ملف الفيديو من السيرفرات الوسيطة حالياً.");
    }

    // --- 3. معالجة التنزيل والحفظ في مجلد الهاتف ---
    async function handleProcessLink() {
      const input = document.getElementById("videoUrlInput");
      const btn = document.getElementById("downloadBtn");
      const url = input.value.trim();

      if (!url) return;

      btn.disabled = true;
      btn.innerText = "جاري استخراج الرابط المباشر...";

      try {
        let streamUrl = url;
        let title = "فيديو مباشر";
        let channel = "@LocalVideo";

        const ytId = extractYouTubeId(url);
        if (ytId) {
          const resolved = await resolveDirectStream(url, ytId);
          streamUrl = resolved.streamUrl;
          title = resolved.title;
          channel = resolved.channel;
        }

        btn.innerText = "جاري الحفظ في مجلد Documents/ShortsVideos...";

        if (window.Capacitor && window.Capacitor.Plugins.Filesystem) {
          const { Filesystem, Directory } = window.Capacitor.Plugins;
          const fileName = `short_${Date.now()}.mp4`;
          const filePath = `${TARGET_FOLDER}/${fileName}`;

          // تنزيل مباشر وكتابة فورية في ذاكرة الهاتف عبر نواة أندرويد
          await Filesystem.downloadFile({
            url: streamUrl,
            path: filePath,
            directory: Directory.Documents,
            progress: true
          });

          // تحويل المسار إلى رابط وسائط محلي وتشغيله فوراً
          const fileUri = await Filesystem.getUri({
            path: filePath,
            directory: Directory.Documents
          });
          const localSrc = window.Capacitor.convertFileSrc(fileUri.uri);

          removePlaceholder();
          renderShortCard({
            src: localSrc,
            title: title,
            channel: channel
          });

          alert("تم تنزيل الفيديو وحفظه بنجاح في مجلد الهاتف!");
          input.value = "";
          closeModal();
        } else {
          alert("تنزيل الملفات في المجلدات متاح عند تثبيت التطبيق بصيغة APK على الهاتف.");
        }
      } catch (err) {
        alert("خطأ: " + (err.message || "حدث خطأ أثناء التنزيل."));
      } finally {
        btn.disabled = false;
        btn.innerText = "تنزيل وحفظ في المجلد";
      }
    }

    // --- 4. تحميل وتشغيل المقاطع المحفوظة محلياً ---
    async function loadLocalShorts() {
      if (!window.Capacitor || !window.Capacitor.Plugins.Filesystem) return;
      const { Filesystem, Directory } = window.Capacitor.Plugins;

      try {
        const result = await Filesystem.readdir({
          path: TARGET_FOLDER,
          directory: Directory.Documents
        });

        if (result.files && result.files.length > 0) {
          removePlaceholder();
          for (const file of result.files) {
            const name = typeof file === 'string' ? file : file.name;
            if (name && name.endsWith('.mp4')) {
              const fileUri = await Filesystem.getUri({
                path: `${TARGET_FOLDER}/${name}`,
                directory: Directory.Documents
              });
              const localSrc = window.Capacitor.convertFileSrc(fileUri.uri);
              renderShortCard({
                src: localSrc,
                title: name.replace('.mp4', ''),
                channel: '@محفوظ_في_الهاتف'
              });
            }
          }
        }
      } catch (_) {}
    }

    // --- 5. رندرة بطاقة الشورتس التفاعلية ---
    const container = document.getElementById("shortsContainer");

    function removePlaceholder() {
      const p = document.getElementById("placeholder");
      if (p) p.remove();
    }

    function renderShortCard(item) {
      const card = document.createElement("div");
      card.className = "short-card";

      card.innerHTML = `
        <video src="${item.src}" loop playsinline preload="metadata"></video>
        <div class="overlay-gradient"></div>
        <div class="action-bar">
          <button class="action-btn" onclick="this.classList.toggle('liked')">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            <span>إعجاب</span>
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.58-6.59c.37-.36.59-.86.59-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
            <span>Dislike</span>
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            <span>تعليق</span>
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
            <span>مشاركة</span>
          </button>
        </div>
        <div class="meta-content">
          <div class="channel-row">
            <div class="channel-avatar"></div>
            <span class="channel-name">${item.channel}</span>
            <button class="subscribe-btn">اشتراك</button>
          </div>
          <div class="video-title">${item.title}</div>
        </div>
        <div class="progress-bar-container"><div class="progress-bar-fill"></div></div>
      `;

      const vid = card.querySelector("video");
      if (vid) {
        card.addEventListener("click", (e) => {
          if (!e.target.closest(".action-bar") && !e.target.closest(".meta-content")) {
            vid.paused ? vid.play() : vid.pause();
          }
        });
        vid.addEventListener("timeupdate", () => {
          const fill = card.querySelector(".progress-bar-fill");
          if (vid.duration && fill) {
            fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
          }
        });
      }

      container.appendChild(card);
      observer.observe(card);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        const vid = e.target.querySelector("video");
        if (vid) {
          if (e.isIntersecting) vid.play().catch(() => {});
          else { vid.pause(); vid.currentTime = 0; }
        }
      });
    }, { threshold: 0.75 });

    function openModal() {
      document.getElementById("overlay").classList.add("active");
      document.getElementById("modalSheet").classList.add("open");
    }

    function closeModal() {
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("modalSheet").classList.remove("open");
    }
  </script>
</body>
</html>
