<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shorts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000;
      overflow: hidden;
    }

    /* حاوية العرض والتمرير الرأسي */
    .shorts-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .shorts-container::-webkit-scrollbar { display: none; }

    .short-card {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .video-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* الشريط العلوي */
    .top-bar {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      pointer-events: none;
    }
    .top-bar * { pointer-events: auto; }

    .shorts-logo {
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* التدرج الظلي السفلي */
    .overlay-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 250px;
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* شريط الأزرار التفاعلي الجانبي */
    .action-bar {
      position: absolute;
      right: 12px;
      bottom: calc(65px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .action-btn svg {
      width: 28px;
      height: 28px;
      fill: #fff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .action-btn span {
      font-size: 11px;
      margin-top: 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .action-btn.liked svg {
      fill: #ff0000;
    }

    .sound-disk {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #111;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotateDisk 4s linear infinite;
    }

    @keyframes rotateDisk {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* بيانات القناة والعنوان */
    .meta-content {
      position: absolute;
      left: 14px;
      right: 80px;
      bottom: calc(65px + env(safe-area-inset-bottom, 0px));
      color: #fff;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .channel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .channel-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #555;
    }

    .channel-name {
      font-size: 13px;
      font-weight: 700;
    }

    .subscribe-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
    }

    .video-title {
      font-size: 13px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* شريط التقدم السفلي */
    .progress-bar-container {
      position: absolute;
      bottom: calc(52px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.2);
      z-index: 30;
    }

    .progress-bar-fill {
      height: 100%;
      background: #ff0000;
      width: 0%;
    }

    /* شريط التنقل السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(52px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #000;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #aaa;
      font-size: 10px;
      background: none;
      border: none;
    }

    .nav-item.active { color: #fff; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; margin-bottom: 2px; }

    /* تأثير القلب النابض */
    .heart-pop-container {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }

    .pop-heart {
      width: 95px;
      height: 95px;
      animation: heartAnim 0.75s ease-out forwards;
    }

    .pop-heart svg {
      width: 100%;
      height: 100%;
      fill: #ff0000;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.7));
    }

    @keyframes heartAnim {
      0% { transform: scale(0.2); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      80% { transform: scale(0.95); opacity: 0.9; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* النافذة المنبثقة */
    .modal-sheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: #212121;
      border-radius: 16px 16px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)) 16px;
      z-index: 200;
      transition: bottom 0.3s ease-out;
    }

    .modal-sheet.open { bottom: 0; }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 150;
      display: none;
    }

    .sheet-overlay.active { display: block; }

    .input-box {
      width: 100%;
      background: #121212;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }

    .action-modal-btn {
      width: 100%;
      background: #fff;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .empty-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      color: #777;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="shorts-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff0000"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>
      Shorts
    </div>
    <div style="color:#fff; cursor:pointer;" onclick="openModal()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </div>
  </div>

  <div class="shorts-container" id="shortsContainer">
    <div class="empty-placeholder" id="placeholder">
      <p style="font-size: 16px; color: #aaa; margin-bottom: 12px;">لا توجد مقاطع حتى الآن</p>
      <p style="font-size: 12px;">اضغط على زر (+) لإضافة وحفظ مقاطع Shorts في الهاتف</p>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>الرئيسية</button>
    <button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33L18 8.87a3.54 3.54 0 0 0-4.85-1.23L7.7 10.7a3.53 3.53 0 0 0-1.84 3.07c0 1.3.7 2.47 1.84 3.07l5.45-3.07a3.53 3.53 0 0 0 1.84-3.07z"/></svg>Shorts</button>
    <button class="nav-item" onclick="openModal()"><svg style="width:34px;height:34px" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>الاشتراكات</button>
  </div>

  <div class="sheet-overlay" id="overlay" onclick="closeModal()"></div>
  <div class="modal-sheet" id="modalSheet">
    <div style="color:#fff;font-weight:bold;margin-bottom:12px;text-align:center;">إضافة وحفظ فيديو في التطبيق</div>
    <input type="text" id="videoUrlInput" class="input-box" placeholder="الصق رابط YouTube Shorts هنا...">
    <button class="action-modal-btn" id="downloadBtn" onclick="handleProcessLink()">حفظ وتشغيل فوري</button>
  </div>

  <script>
    const TARGET_FOLDER = 'ShortsVideos';
    const YT_STORAGE_KEY = 'shorts_saved_youtube_list_v1';

    // ==========================================================
    // 1. خوارزمية الترتيب السلوكي
    // ==========================================================
    class ShortsAlgorithm {
      constructor() {
        this.key = "shorts_algorithm_scores_v2";
        this.scores = JSON.parse(localStorage.getItem(this.key)) || {};
      }

      getScore(id) {
        return this.scores[id] || 100;
      }

      onFinishWatch(id, watchTime, totalDuration, loopCount) {
        let score = this.getScore(id);
        if (watchTime < 2.0 && loopCount === 0) {
          score = Math.max(10, score - 40);
        } else if ((watchTime / totalDuration) >= 0.85 || loopCount > 0) {
          score += 50 + (loopCount * 30);
        }
        this.scores[id] = score;
        this.save();
      }

      onLike(id, isLiked) {
        let score = this.getScore(id);
        score += isLiked ? 35 : -35;
        this.scores[id] = score;
        this.save();
      }

      rank(list) {
        return [...list].sort((a, b) => {
          if (Math.random() < 0.20) return 0.5 - Math.random();
          return this.getScore(b.id) - this.getScore(a.id);
        });
      }

      save() {
        localStorage.setItem(this.key, JSON.stringify(this.scores));
      }
    }

    const algo = new ShortsAlgorithm();

    // ==========================================================
    // 2. محرك تدوير المشغلات والذاكرة
    // ==========================================================
    class FeedVirtualizer {
      constructor(container) {
        this.container = container;
        this.videos = [];
        this.cardElements = [];
        this.currentIndex = -1;
        this.activeWatchStart = 0;
        this.loopCounter = 0;

        this.setupObserver();
      }

      setVideos(videoList) {
        this.videos = algo.rank(videoList);
        this.container.innerHTML = "";
        this.cardElements = [];

        if (this.videos.length === 0) return;

        this.videos.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "short-card";
          card.dataset.index = index;

          card.innerHTML = `
            <div class="video-wrapper" id="wrap-${index}"></div>
            <div class="overlay-gradient"></div>
            <div class="heart-pop-container"></div>
            <div class="action-bar">
              <button class="action-btn like-btn" onclick="handleLikeClick(event, ${index})">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                <span>إعجاب</span>
              </button>
              <button class="action-btn">
                <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.58-6.59c.37-.36.59-.86.59-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
                <span>Dislike</span>
              </button>
              <button class="action-btn">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                <span>تعليق</span>
              </button>
              <button class="action-btn">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                <span>مشاركة</span>
              </button>
              <div class="sound-disk">
                <svg width="16" height="16" fill="#fff" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
              </div>
            </div>
            <div class="meta-content">
              <div class="channel-row">
                <div class="channel-avatar"></div>
                <span class="channel-name">${item.channel}</span>
                <button class="subscribe-btn">اشتراك</button>
              </div>
              <div class="video-title">${item.title}</div>
            </div>
            <div class="progress-bar-container"><div class="progress-bar-fill"></div></div>
          `;

          this.attachInteractions(card, index);
          this.container.appendChild(card);
          this.cardElements.push(card);
          this.observer.observe(card);
        });

        this.updateActiveWindow(0);
      }

      setupObserver() {
        this.observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const idx = parseInt(entry.target.dataset.index);
              this.updateActiveWindow(idx);
            }
          });
        }, { threshold: 0.6 });
      }

      updateActiveWindow(newIndex) {
        if (newIndex === this.currentIndex) return;

        if (this.currentIndex >= 0 && this.videos[this.currentIndex]) {
          const prevVideo = this.videos[this.currentIndex];
          const prevCard = this.cardElements[this.currentIndex];
          const prevVid = prevCard ? prevCard.querySelector("video") : null;
          const duration = prevVid && prevVid.duration ? prevVid.duration : 15;
          const watchedTime = (Date.now() - this.activeWatchStart) / 1000;
          algo.onFinishWatch(prevVideo.id, watchedTime, duration, this.loopCounter);
        }

        this.currentIndex = newIndex;
        this.activeWatchStart = Date.now();
        this.loopCounter = 0;

        const activeRange = new Set([newIndex - 1, newIndex, newIndex + 1]);

        this.cardElements.forEach((card, idx) => {
          const wrapper = card.querySelector(".video-wrapper");
          if (activeRange.has(idx)) {
            if (!wrapper.hasChildNodes()) {
              this.attachVideoElement(wrapper, this.videos[idx], idx);
            }
            const vid = wrapper.querySelector("video");
            if (vid) {
              if (idx === newIndex) {
                vid.currentTime = 0;
                vid.play().catch(() => {});
              } else {
                vid.pause();
                vid.currentTime = 0;
              }
            }
          } else {
            const vid = wrapper.querySelector("video");
            if (vid) {
              vid.pause();
              vid.removeAttribute("src");
              vid.load();
            }
            wrapper.innerHTML = "";
          }
        });
      }

      attachVideoElement(wrapper, item, index) {
        if (item.type === 'youtube') {
          wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${item.src}?autoplay=1&loop=1&playlist=${item.src}&controls=0&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        } else {
          const vid = document.createElement("video");
          vid.src = item.src;
          vid.loop = true;
          vid.playsInline = true;
          vid.preload = (index === this.currentIndex) ? "auto" : "metadata";

          vid.addEventListener("timeupdate", () => {
            const card = this.cardElements[index];
            if (!card) return;
            const fill = card.querySelector(".progress-bar-fill");
            if (vid.duration && fill) {
              fill.style.width = `${(vid.currentTime / vid.duration) * 100}%`;
            }
          });

          vid.addEventListener("ended", () => {
            if (index === this.currentIndex) this.loopCounter += 1;
          });

          wrapper.appendChild(vid);
        }
      }

      attachInteractions(card, index) {
        let lastTap = 0;
        let holdTimer = null;

        card.addEventListener("touchstart", (e) => {
          if (e.target.closest(".action-bar") || e.target.closest(".meta-content")) return;
          holdTimer = setTimeout(() => {
            const vid = card.querySelector("video");
            if (vid && !vid.paused) vid.pause();
          }, 250);
        });

        card.addEventListener("touchend", () => {
          clearTimeout(holdTimer);
          const vid = card.querySelector("video");
          if (vid && vid.paused && parseInt(card.dataset.index) === this.currentIndex) {
            vid.play().catch(() => {});
          }
        });

        card.addEventListener("click", (e) => {
          if (e.target.closest(".action-bar") || e.target.closest(".meta-content")) return;
          const now = Date.now();
          if (now - lastTap < 300) {
            this.showHeartAnimation(card);
            const btn = card.querySelector(".like-btn");
            if (btn && !btn.classList.contains("liked")) {
              btn.classList.add("liked");
              algo.onLike(this.videos[index].id, true);
            }
          }
          lastTap = now;
        });
      }

      showHeartAnimation(card) {
        const container = card.querySelector(".heart-pop-container");
        const heart = document.createElement("div");
        heart.className = "pop-heart";
        heart.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        container.appendChild(heart);
        setTimeout(() => heart.remove(), 750);
      }
    }

    const virtualizer = new FeedVirtualizer(document.getElementById("shortsContainer"));

    function handleLikeClick(e, index) {
      e.stopPropagation();
      const btn = e.currentTarget;
      const isLiked = btn.classList.toggle("liked");
      algo.onLike(virtualizer.videos[index].id, isLiked);
    }

    // ==========================================================
    // 3. تهيئة بيئة Capacitor وتحميل الملفات
    // ==========================================================
    window.addEventListener('DOMContentLoaded', async () => {
      if (window.Capacitor && window.Capacitor.Plugins.StatusBar) {
        const { StatusBar } = window.Capacitor.Plugins;
        try {
          await StatusBar.hide();
          await StatusBar.setOverlaysWebView({ overlay: true });
        } catch (_) {}
      }
      await initStorageAndLoadFiles();
    });

    async function initStorageAndLoadFiles() {
      if (window.Capacitor && window.Capacitor.Plugins.Filesystem) {
        const { Filesystem, Directory } = window.Capacitor.Plugins;
        try {
          await Filesystem.requestPermissions();
          await Filesystem.mkdir({
            path: TARGET_FOLDER,
            directory: Directory.Documents,
            recursive: true
          });
        } catch (_) {}
      }
      await loadCombinedFeed();
    }

    // ==========================================================
    // 4. دالة استخراج ذكية مع قاطع للمهلة (Timeout Controller)
    // ==========================================================
    function extractYouTubeId(url) {
      const match = url.match(/(?:shorts\/|v=|youtu\.be\/|\/v\/|embed\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    // ==========================================================
    // 4. تنزيل متعدد المسارات: Native yt-dlp -> Server -> Cobalt -> Invidious -> حفظ الرابط
    // ==========================================================
    const PRIVATE_SERVER_KEY = "shorts_private_server_url";

    function getNativeYtDlp() {
      try {
        return window.Capacitor?.Plugins?.YtDlp || null;
      } catch (_) {
        return null;
      }
    }

    async function tryNativeYtDlp(rawUrl) {
      const plugin = getNativeYtDlp();
      if (!plugin) throw new Error("Native yt-dlp plugin is not installed");

      try {
        if (plugin.addListener) {
          await plugin.addListener("progress", (event) => {
            const p = Number(event?.progress);
            if (Number.isFinite(p)) {
              const btn = document.getElementById("downloadBtn");
              if (btn) btn.innerText = `المحاولة 1/5: تنزيل مباشر ${Math.round(p)}%`;
            }
          });
        }
      } catch (_) {}

      const result = await plugin.download({ url: rawUrl, quality: "720" });
      if (!result || result.success !== true || !result.filePath) {
        throw new Error(result?.message || "Native yt-dlp returned no file");
      }
      return result;
    }

    function getPrivateServerUrl() {
      return (localStorage.getItem(PRIVATE_SERVER_KEY) || "").trim().replace(/\/$/, "");
    }

    async function tryPrivateServer(rawUrl) {
      const base = getPrivateServerUrl();
      if (!base) throw new Error("No private server configured");
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);
      try {
        const res = await fetch(`${base}/download`, {
          method: "POST",
          headers: { "Accept": "application/json", "Content-Type": "application/json" },
          body: JSON.stringify({ url: rawUrl, quality: "720" }),
          signal: controller.signal
        });
        if (!res.ok) throw new Error(`Server HTTP ${res.status}`);
        const data = await res.json();
        if (data?.url) return data.url;
        throw new Error("Server did not return a download URL");
      } finally {
        clearTimeout(timer);
      }
    }

    async function tryCobalt(rawUrl) {
      // Public Cobalt instances are intentionally treated as experimental.
      // A self-hosted instance is preferred; set it in shorts_private_server_url.
      const endpoints = [
        "https://cobaltapi.getnickel.app",
        "https://api.cobalt.tools"
      ];
      for (const endpoint of endpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 7000);
          try {
            const res = await fetch(endpoint, {
              method: "POST",
              headers: { "Accept": "application/json", "Content-Type": "application/json" },
              body: JSON.stringify({ url: rawUrl, videoQuality: "720", downloadMode: "auto" }),
              signal: controller.signal
            });
            if (res.ok) {
              const data = await res.json();
              if (data?.url) return data.url;
              if (data?.picker?.length) {
                const item = data.picker.find(x => /mp4|video/i.test(x?.type || "")) || data.picker[0];
                if (item?.url) return item.url;
              }
            }
          } finally {
            clearTimeout(timer);
          }
        } catch (_) {}
      }
      throw new Error("Cobalt endpoints failed");
    }

    async function tryInvidious(rawUrl, videoId) {
      const instances = [
        "https://inv.nadeko.net",
        "https://invidious.nerdvpn.de",
        "https://yt.chocolatemoo53.com",
        "https://invidious.tiekoetter.com",
        "https://inv.tux.pizza"
      ];
      for (const base of instances) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 7000);
          try {
            const res = await fetch(`${base}/api/v1/videos/${videoId}`, {
              method: "GET",
              headers: { "Accept": "application/json" },
              signal: controller.signal
            });
            if (res.ok) {
              const data = await res.json();
              if (data?.formatStreams?.length) {
                const streams = data.formatStreams.filter(s => s?.url);
                const mp4 = streams.find(s => s.container === "mp4" && (!s.resolution || /720|480|360/.test(s.resolution)));
                if (mp4?.url) return mp4.url;
                if (streams[0]?.url) return streams[0].url;
              }
            }
          } finally {
            clearTimeout(timer);
          }
        } catch (_) {}
      }
      throw new Error("Invidious instances failed");
    }

    async function downloadDirectUrlToDocuments(url, prefix = "short") {
      if (!(window.Capacitor && window.Capacitor.Plugins.Filesystem)) {
        throw new Error("Filesystem plugin is not available");
      }
      const { Filesystem, Directory } = window.Capacitor.Plugins;
      const fileName = `${prefix}_${Date.now()}.mp4`;
      await Filesystem.downloadFile({
        url,
        path: `${TARGET_FOLDER}/${fileName}`,
        directory: Directory.Documents
      });
      return fileName;
    }

    async function handleProcessLink() {
      const input = document.getElementById("videoUrlInput");
      const btn = document.getElementById("downloadBtn");
      const url = input.value.trim();
      if (!url) return;

      btn.disabled = true;
      btn.innerText = "جاري الفحص...";

      try {
        const ytId = extractYouTubeId(url);

        // رابط MP4 مباشر: لا حاجة لاستخراج YouTube.
        if (!ytId) {
          btn.innerText = "جاري التنزيل المباشر...";
          await downloadDirectUrlToDocuments(url, "short");
          alert("تم تنزيل الفيديو وحفظه في مجلد الهاتف بنجاح!");
          input.value = "";
          closeModal();
          await loadCombinedFeed();
          return;
        }

        // 1) المحرك الأصلي داخل APK — أهم مسار.
        try {
          btn.innerText = "المحاولة 1/5: المحرك الأصلي...";
          const native = await tryNativeYtDlp(url);
          const nativeItem = {
            id: `native_${Date.now()}`,
            type: "local-native",
            src: window.Capacitor.convertFileSrc(native.filePath),
            nativeUri: native.uri || null,
            title: "YouTube Short",
            channel: "@Shorts"
          };
          saveYouTubeLinkLocally(nativeItem);
          alert("تم تنزيل الفيديو بواسطة المحرك الأصلي داخل التطبيق وحفظه في الهاتف.");
          input.value = "";
          closeModal();
          await loadCombinedFeed();
          return;
        } catch (e) {
          console.warn("Native yt-dlp failed", e);
        }

        // 2) خادم خاص (اختياري — مثل جهاز المنزل عبر Tailscale).
        try {
          btn.innerText = "المحاولة 2/5: الخادم الخاص...";
          const direct = await tryPrivateServer(url);
          await downloadDirectUrlToDocuments(direct, "short_server");
          alert("تم التنزيل عبر الخادم الخاص وحفظ الفيديو في الهاتف.");
          input.value = "";
          closeModal();
          await loadCombinedFeed();
          return;
        } catch (e) {
          console.warn("Private server failed", e);
        }

        // 3) Cobalt.
        try {
          btn.innerText = "المحاولة 3/5: Cobalt...";
          const direct = await tryCobalt(url);
          await downloadDirectUrlToDocuments(direct, "short_cobalt");
          alert("تم تنزيل الفيديو عبر Cobalt وحفظه في الهاتف.");
          input.value = "";
          closeModal();
          await loadCombinedFeed();
          return;
        } catch (e) {
          console.warn("Cobalt failed", e);
        }

        // 4) Invidious.
        try {
          btn.innerText = "المحاولة 4/5: Invidious...";
          const direct = await tryInvidious(url, ytId);
          await downloadDirectUrlToDocuments(direct, "short_invidious");
          alert("تم تنزيل الفيديو عبر Invidious وحفظه في الهاتف.");
          input.value = "";
          closeModal();
          await loadCombinedFeed();
          return;
        } catch (e) {
          console.warn("Invidious failed", e);
        }

        // 5) لا نحذف الرابط: نحفظه للمشاهدة داخل التطبيق.
        btn.innerText = "المحاولة 5/5: حفظ الرابط...";
        saveYouTubeLinkLocally({
          id: ytId,
          type: "youtube",
          src: ytId,
          title: "YouTube Short",
          channel: "@Shorts"
        });
        alert("لم تنجح مسارات التنزيل المتاحة حاليًا، لذلك تم حفظ الرابط للمشاهدة داخل التطبيق.");
        input.value = "";
        closeModal();
        await loadCombinedFeed();

      } catch (err) {
        console.error(err);
        alert("حدث خطأ غير متوقع، يرجى المحاولة مرة أخرى.");
      } finally {
        btn.disabled = false;
        btn.innerText = "حفظ وتشغيل فوري";
      }
    }

    function saveYouTubeLinkLocally(item) {
      const list = JSON.parse(localStorage.getItem(YT_STORAGE_KEY)) || [];
      if (!list.some(x => x.src === item.src)) {
        list.unshift(item);
        localStorage.setItem(YT_STORAGE_KEY, JSON.stringify(list));
      }
    }

    // ==========================================================
    // 5. دمج الفيديوهات المحفوظة محلياً والمدرجة في خلاصة واحدة
    // ==========================================================
    async function loadCombinedFeed() {
      const combined = [];

      // 1. قراءة الفيديوهات المخزنة في مجلد الهاتف
      if (window.Capacitor && window.Capacitor.Plugins.Filesystem) {
        const { Filesystem, Directory } = window.Capacitor.Plugins;
        try {
          const result = await Filesystem.readdir({
            path: TARGET_FOLDER,
            directory: Directory.Documents
          });

          if (result.files && result.files.length > 0) {
            for (const file of result.files) {
              const name = typeof file === 'string' ? file : file.name;
              if (name && name.endsWith('.mp4')) {
                const fileUri = await Filesystem.getUri({
                  path: `${TARGET_FOLDER}/${name}`,
                  directory: Directory.Documents
                });
                combined.push({
                  id: name,
                  type: 'local',
                  src: window.Capacitor.convertFileSrc(fileUri.uri),
                  title: name.replace('.mp4', ''),
                  channel: '@محفوظ_في_الهاتف'
                });
              }
            }
          }
        } catch (_) {}
      }

      // 2. قراءة الفيديوهات المدرجة عبر يوتيوب
      const ytList = JSON.parse(localStorage.getItem(YT_STORAGE_KEY)) || [];
      ytList.forEach(item => combined.push(item));

      const placeholder = document.getElementById("placeholder");
      if (combined.length > 0) {
        if (placeholder) placeholder.style.display = "none";
        virtualizer.setVideos(combined);
      } else {
        if (placeholder) placeholder.style.display = "flex";
      }
    }


    // يمكن ضبط الخادم الخاص من JavaScript/DevTools عبر:
    // localStorage.setItem("shorts_private_server_url", "http://100.x.x.x:8787");
    function openModal() {
      document.getElementById("overlay").classList.add("active");
      document.getElementById("modalSheet").classList.add("open");
    }

    function closeModal() {
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("modalSheet").classList.remove("open");
    }
  </script>
</body>
